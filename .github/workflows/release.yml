name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: nothing is published unless the solution compiles and the tests pass.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build DesktopBuckets.sln -c Release --nologo

      - name: Test
        run: dotnet test DesktopBuckets.sln -c Release --no-build --nologo

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version & channel
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            echo "version=$V"            >> "$GITHUB_OUTPUT"
            echo "channel=stable"        >> "$GITHUB_OUTPUT"
            echo "rel_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "rel_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"      >> "$GITHUB_OUTPUT"
          else
            V="0.1.${{ github.run_number }}"
            echo "version=$V"            >> "$GITHUB_OUTPUT"
            echo "channel=nightly"       >> "$GITHUB_OUTPUT"
            echo "rel_tag=nightly"       >> "$GITHUB_OUTPUT"
            echo "rel_name=$V"           >> "$GITHUB_OUTPUT"
            echo "prerelease=true"       >> "$GITHUB_OUTPUT"
          fi

      # Portable PDBs are produced so a stack trace in log.txt has line numbers; they
      # are kept as a workflow artifact (below) and excluded from the installer.
      - name: Publish (self-contained win-x64)
        shell: bash
        run: |
          dotnet publish src/DesktopBuckets/DesktopBuckets.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:DebugType=portable \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBuckets-symbols-${{ steps.ver.outputs.version }}
          path: publish/*.pdb
          if-no-files-found: warn

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build shell-extension DLL
        shell: cmd
        run: native\ShellExt\build.cmd

      - name: Build + sign the shell-extension package
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PW: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "::warning::SIGNING_PFX_BASE64 secret not set - shipping without the Windows 11 shell package (legacy 'Show more options' verb only)."
            exit 0
          }
          [IO.File]::WriteAllBytes("packaging/DesktopBuckets-Dev.pfx", [Convert]::FromBase64String($env:PFX_B64))
          & packaging/build-package.ps1 -Version "${{ steps.ver.outputs.version }}" `
              -PfxPath "packaging/DesktopBuckets-Dev.pfx" -PfxPassword "$env:PFX_PW"
          Copy-Item native/ShellExt/out/DesktopBuckets.ShellExt.dll publish/ -Force
          Copy-Item packaging/out/DesktopBuckets.Package.msix        publish/ -Force
          Copy-Item packaging/DesktopBuckets.cer                     publish/ -Force

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer/DesktopBuckets.iss

      # The app refuses to launch a downloaded installer unless it carries an intact
      # Authenticode signature from the pinned certificate (UpdateService.
      # InstallerSignerThumbprint), so an unsigned build here would never auto-update.
      - name: Sign installer
        shell: pwsh
        env:
          PFX_PW: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path packaging/DesktopBuckets-Dev.pfx)) {
            Write-Host "::error::No signing key - the installer would be rejected by the in-app updater."
            exit 1
          }
          & packaging/sign-file.ps1 -Path (Get-Item installer/Output/*.exe).FullName `
              -PfxPath packaging/DesktopBuckets-Dev.pfx -PfxPassword "$env:PFX_PW"

      - name: Remove signing key from the runner
        if: always()
        shell: pwsh
        run: Remove-Item packaging/DesktopBuckets-Dev.pfx -Force -ErrorAction SilentlyContinue

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopBuckets-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish nightly release
        if: steps.ver.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          NOTES=$(printf 'Rolling build from `main` @ %s\n\n%s' \
            "${GITHUB_SHA:0:7}" "$(git log -1 --pretty=%B)")
          gh release create nightly installer/Output/*.exe \
            --title "${{ steps.ver.outputs.rel_name }}" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Publish tagged release
        if: steps.ver.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.rel_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installer/Output/*.exe --clobber
          else
            gh release create "$TAG" installer/Output/*.exe --title "$TAG" --generate-notes
          fi
