name: ci

# Build + test gate for pull requests and feature branches. Pushes to `main` are
# covered by the `test` job in release.yml, which the release build depends on —
# so nothing reaches the nightly channel without compiling and passing tests.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build DesktopBuckets.sln -c Release --nologo

      - name: Test
        run: dotnet test DesktopBuckets.sln -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
